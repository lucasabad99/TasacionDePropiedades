<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tasador" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Panel · Tasador Inmobiliario</title>
  </head>
  <body class="protegida">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/panel.html">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>
          </span>
          <div class="brand-text">
            <strong data-app="nombre">Tasador Inmobiliario</strong>
            <small id="marcaSub">Panel</small>
          </div>
        </a>
        <div class="topbar-acciones" id="topbarAcciones"></div>
      </div>
    </header>

    <main class="panel">
      <div class="panel-head">
        <div>
          <h1 id="panelTitulo">Panel</h1>
          <p id="panelSubtitulo"></p>
        </div>
        <div class="panel-head-acciones">
          <button type="button" class="btn btn-secondary" id="btnExportar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
            Exportar CSV
          </button>
          <a href="/" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Nueva tasación
          </a>
        </div>
      </div>

      <!-- Indicadores -->
      <section aria-labelledby="t-kpis">
        <h2 class="sr-only" id="t-kpis">Resumen</h2>
        <p class="kpis-alcance" id="kpisAlcance"></p>
        <div class="kpis" id="kpis"></div>
      </section>

      <!-- Agentes -->
      <section class="panel-section" aria-labelledby="t-agentes" data-solo-admin hidden>
        <div class="section-head">
          <h2 id="t-agentes">Agentes</h2>
          <button type="button" class="link-btn" id="btnVerTodos" hidden>Ver todos los agentes</button>
        </div>
        <div class="agentes" id="agentes">
          <p class="estado-vacio">Cargando…</p>
        </div>
      </section>

      <!-- Tabla de tasaciones -->
      <section class="panel-section" aria-labelledby="tituloTabla">
        <div class="section-head">
          <h2 id="tituloTabla">Tasaciones</h2>
          <span class="conteo" id="conteo"></span>
        </div>

        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label for="buscar" class="sr-only">Buscar</label>
            <input type="search" id="buscar" placeholder="Buscar por dirección, cliente o tipo…" />
          </div>
          <label for="filtroAgente" class="sr-only" data-solo-admin hidden>Filtrar por agente</label>
          <select id="filtroAgente" data-solo-admin hidden></select>
        </div>

        <div class="tabla-wrap">
          <table class="tabla">
            <thead>
              <tr>
                <th scope="col">Fecha</th>
                <th scope="col">Propiedad</th>
                <th scope="col">Cliente</th>
                <th scope="col" class="col-agente">Agente</th>
                <th scope="col" class="num">Total</th>
              </tr>
            </thead>
            <tbody id="filas"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Detalle de una tasación -->
    <dialog class="dialog dialog-detalle" id="dlgDetalle" aria-labelledby="detTitulo">
      <div class="dialog-head">
        <h2 id="detTitulo">Tasación</h2>
        <button type="button" class="btn-icon" data-cerrar aria-label="Cerrar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="dialog-body" id="detCuerpo"></div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-danger-ghost" id="detEliminar">Eliminar</button>
        <button type="button" class="btn btn-secondary" id="detImprimir">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
          Imprimir informe
        </button>
      </div>
    </dialog>

    <section id="reporte" class="reporte" aria-hidden="true"></section>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/src/pages/panel.js"></script>
  </body>
</html>
