<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tasador" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Ingresar · Tasador Inmobiliario</title>
  </head>
  <body class="login-page">
    <main class="login-wrap">
      <div class="login-card">
        <div class="login-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>
          </span>
          <h1 data-app="nombre">Tasador Inmobiliario</h1>
          <p>Ingresá con tu usuario para tasar</p>
        </div>

        <p class="login-aviso" id="aviso" role="status" hidden></p>

        <form id="formLogin" class="login-form" novalidate>
          <div class="field">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <div class="affix">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" class="affix-btn" id="verPassword" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <p class="login-error" id="error" role="alert" hidden></p>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnIngresar">Ingresar</button>
        </form>
        <a class="login-sitio" href="/">← Ver las propiedades publicadas</a>
      </div>

      <!-- Accesos de prueba: solo aparece si el backend tiene DEMO_MODE=true -->
      <section class="demo-box" id="demoBox" aria-labelledby="t-demo" hidden>
        <div class="demo-head">
          <span class="demo-tag">Modo prueba</span>
          <h2 id="t-demo">Accesos de prueba</h2>
        </div>
        <p class="demo-hint">Tocá un usuario para completar los datos.</p>
        <div class="demo-tabla" role="list">
          <div class="demo-fila demo-encabezado" aria-hidden="true">
            <span>Usuario</span><span>Contraseña</span><span>Rol</span>
          </div>
          <div id="demoFilas"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
